# xdg-desktop-portal-wlr for a wayland-canvas session. Installed into the
# per-desktop directory (sysconfdir/xdg/xdg-desktop-portal-wlr/wayland-canvas),
# so an xdg-desktop-portal-wlr serving another compositor on the same user
# bus never sees this chooser.
[screencast]
chooser_type = dmenu
chooser_cmd = wayland-canvas msg capture.pick
