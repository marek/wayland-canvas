# xdg-desktop-portal-wlr for a wayland-canvas session. Installed as
# sysconfdir/xdg/xdg-desktop-portal-wlr/wayland-canvas: xdpw reads the file
# named after each element of $XDG_CURRENT_DESKTOP before its own `config`,
# so an xdg-desktop-portal-wlr serving another compositor on the same user
# bus never sees this chooser. The chooser reaches the compositor through
# the $WAYLAND_DISPLAY the session hands over.
[screencast]
chooser_type = dmenu
chooser_cmd = wayland-canvas msg capture.pick
