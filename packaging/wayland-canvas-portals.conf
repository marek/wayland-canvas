# xdg-desktop-portal backends for a wayland-canvas session
# (XDG_CURRENT_DESKTOP=wayland-canvas:wlroots): screen sharing and screenshots
# through the wlroots backend (xdg-desktop-portal-wlr), everything else
# through the GTK one.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
